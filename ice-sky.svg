<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Icy blue sky and water</title>
  <desc id="desc">An animated bright sky-blue horizon with luminous water waves and drifting light.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7fbff"/>
      <stop offset="0.46" stop-color="#8edcff"/>
      <stop offset="1" stop-color="#197fc9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0968b5"/>
      <stop offset="0.52" stop-color="#4acbff"/>
      <stop offset="1" stop-color="#075da9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="42%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#d9f8ff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#a8e8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur-8"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="360" fill="url(#sky)"/>
  <ellipse cx="800" cy="172" rx="580" ry="190" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#ffffff" opacity="0.38" filter="url(#blur-24)">
    <ellipse cx="210" cy="92" rx="180" ry="26">
      <animateTransform attributeName="transform" type="translate" values="-70 0;80 0;-70 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1280" cy="70" rx="235" ry="34">
      <animateTransform attributeName="transform" type="translate" values="70 0;-80 0;70 0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <path d="M0 220 C170 188 310 243 472 214 C672 178 805 250 990 216 C1190 178 1400 232 1600 201 L1600 360 L0 360Z" fill="url(#water)" opacity="0.8"/>
  <g fill="none" stroke="#ddfaff" stroke-linecap="round">
    <path d="M-40 263 C180 226 320 302 532 261 C732 222 865 298 1070 260 C1260 225 1440 284 1650 245" stroke-width="4" opacity="0.74">
      <animateTransform attributeName="transform" type="translate" values="-50 0;50 0;-50 0" dur="6.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-60 302 C114 266 332 339 538 299 C732 262 944 338 1134 298 C1320 260 1482 323 1660 288" stroke-width="3" opacity="0.62">
      <animateTransform attributeName="transform" type="translate" values="60 0;-45 0;60 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 333 C130 294 348 362 580 329 C788 299 985 369 1213 327 C1400 292 1538 339 1680 314" stroke-width="2" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="-35 0;55 0;-35 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#blur-8)">
    <rect x="-260" y="222" width="420" height="10" rx="5" fill="url(#shine)" opacity="0.8">
      <animate attributeName="x" values="-420;1600" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-340" y="292" width="290" height="8" rx="4" fill="url(#shine)" opacity="0.6">
      <animate attributeName="x" values="-320;1620" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#ffffff" opacity="0.8">
    <circle cx="236" cy="142" r="3"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="486" cy="104" r="2"><animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1137" cy="131" r="3"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="177" r="2"><animate attributeName="opacity" values="0;1;0" dur="5.1s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
