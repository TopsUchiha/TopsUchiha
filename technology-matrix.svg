<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Technology matrix</title>
  <desc id="desc">An icy blue technology matrix for frontend, backend, security, and systems work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a35"/>
      <stop offset="0.48" stop-color="#0b4e87"/>
      <stop offset="1" stop-color="#9eeeff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#dffaff" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#70d6ff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#56d8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#56d8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="11" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#background)"/>
  <g opacity="0.22" stroke="#bff7ff" fill="none">
    <path d="M0 112 H1600 M0 236 H1600 M0 360 H1600 M0 484 H1600"/>
    <path d="M190 0 V620 M510 0 V620 M830 0 V620 M1150 0 V620 M1470 0 V620"/>
  </g>
  <g fill="#e9fdff">
    <circle cx="115" cy="84" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1456" cy="148" r="4"><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1296" cy="502" r="3"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="311" cy="530" r="2"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="100" y="108" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="7">TECHNOLOGY MATRIX</text>
  <text x="101" y="146" fill="#c7f7ff" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1">THE TOOLS BEHIND THE WORK</text>
  <rect x="100" y="168" width="260" height="3" fill="url(#line)" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(100 218)">
      <rect width="320" height="230" rx="20" fill="url(#card)" stroke="#bff7ff" stroke-opacity="0.42"/>
      <text x="30" y="55" fill="#ffffff" font-size="25" font-weight="700">FRONTEND</text>
      <text x="30" y="96" fill="#d8fbff" font-size="19">Next.js · React</text>
      <text x="30" y="130" fill="#d8fbff" font-size="19">TypeScript · Tailwind</text>
      <text x="30" y="164" fill="#d8fbff" font-size="19">Responsive interfaces</text>
      <path d="M30 194 H290" stroke="#7be3ff" stroke-opacity="0.55"/>
      <text x="30" y="214" fill="#8ceaff" font-size="15" letter-spacing="2">PRODUCT EXPERIENCE</text>
    </g>
    <g transform="translate(460 218)">
      <rect width="320" height="230" rx="20" fill="url(#card)" stroke="#bff7ff" stroke-opacity="0.42"/>
      <text x="30" y="55" fill="#ffffff" font-size="25" font-weight="700">BACKEND</text>
      <text x="30" y="96" fill="#d8fbff" font-size="19">Node.js · Express</text>
      <text x="30" y="130" fill="#d8fbff" font-size="19">PostgreSQL · SQLite</text>
      <text x="30" y="164" fill="#d8fbff" font-size="19">Admin workflows</text>
      <path d="M30 194 H290" stroke="#7be3ff" stroke-opacity="0.55"/>
      <text x="30" y="214" fill="#8ceaff" font-size="15" letter-spacing="2">SYSTEMS THAT RUN</text>
    </g>
    <g transform="translate(820 218)">
      <rect width="320" height="230" rx="20" fill="url(#card)" stroke="#bff7ff" stroke-opacity="0.42"/>
      <text x="30" y="55" fill="#ffffff" font-size="25" font-weight="700">SECURITY</text>
      <text x="30" y="96" fill="#d8fbff" font-size="19">PortSwigger · Burp Suite</text>
      <text x="30" y="130" fill="#d8fbff" font-size="19">Authentication · APIs</text>
      <text x="30" y="164" fill="#d8fbff" font-size="19">Hands-on web security</text>
      <path d="M30 194 H290" stroke="#7be3ff" stroke-opacity="0.55"/>
      <text x="30" y="214" fill="#8ceaff" font-size="15" letter-spacing="2">PRACTICE IN PUBLIC</text>
    </g>
    <g transform="translate(1180 218)">
      <rect width="320" height="230" rx="20" fill="url(#card)" stroke="#bff7ff" stroke-opacity="0.42"/>
      <text x="30" y="55" fill="#ffffff" font-size="25" font-weight="700">SYSTEMS</text>
      <text x="30" y="96" fill="#d8fbff" font-size="19">Linux · C</text>
      <text x="30" y="130" fill="#d8fbff" font-size="19">GNU Make · Kbuild</text>
      <text x="30" y="164" fill="#d8fbff" font-size="19">Kernel modules</text>
      <path d="M30 194 H290" stroke="#7be3ff" stroke-opacity="0.55"/>
      <text x="30" y="214" fill="#8ceaff" font-size="15" letter-spacing="2">UNDER THE HOOD</text>
    </g>
  </g>

  <path d="M0 530 C170 495 322 561 490 530 C690 491 864 562 1054 528 C1246 493 1424 548 1600 520 V620 H0Z" fill="#0a75bb" fill-opacity="0.55"/>
  <path d="M-30 562 C210 526 365 596 587 558 C792 523 972 592 1184 553 C1370 520 1505 568 1640 542" fill="none" stroke="#d9fbff" stroke-width="3" stroke-opacity="0.72">
    <animateTransform attributeName="transform" type="translate" values="-45 0;45 0;-45 0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
